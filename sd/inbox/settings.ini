# Pocket Inbox settings (copy to the SD card as /inbox/settings.ini)

# Route confidence below this -> "Not sure" + Review queue. Tuned in M0 (host/inbox_eval.mjs).
confidence_threshold = 0.35
# A span field is kept only if the model's P(present) is at least this.
span_min_present = 0.5
# Minutes east of UTC, used when the clock is set by NTP.
utc_offset_min = 0
# Default currency when an amount has none.
currency = EUR
# WiFi is used only for NTP and export, then switched off.
wifi_ssid =
wifi_pass =
